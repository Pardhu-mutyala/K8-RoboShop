apiVersion: apps/v1
kind: Deployment
metadata: 
  name: redis
  namespace: roboshop
  #replica set labels which can used under selectors to club the images
  labels:
    project: roboshop
    component: redis
    tier: database
spec:
  replicas: 1
  # these are the labels replica set labels to create pod replicas, this should match pod labels
  selector:
    matchLabels:
      project: roboshop
      component: redis
      tier: database
  #this is pod defnition template
  template:
    metadata:
      labels:
        project: roboshop
        component: redis
        tier: database
    spec:
      containers:
        - name: redis
          image: redis:7.0

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: roboshop
  labels:
    project: roboshop
    component: redis
    tier: database
spec:
  selector:
    project: roboshop
    component: redis
    tier: database
  ports:
    - protocol: TCP
      port: 6379 # service port
      targetPort: 6379 # container port
