---
apiVersion: v1
kind: Deployment
metadata: 
  name: mysql
  namespace: roboshop
  #replica set labels which can used under selectors to club the images
  labels:
    project: roboshop
    component: mysql
    tier: database
spec:
  replicas: 1
  # these are the labels replica set labels to create pod replicas, this should match pod labels
  selector:
    matchLabels:
      project: roboshop
      component: mysql
      tier: database
  #this is pod defnition template
  template:
    metadata:
      labels:
        project: roboshop
        component: mysql
        tier: database
    spec:

      volumes:
        - name: mysql-secret
          emptyDir: {}
      containers:
        - name: mysql
          image: pardhu72/mysql:v1
      initContainers:
        - name: fetch-secret
          image: amazon/aws-cli
          command:
          - sh
          - -c
          - |
              aws secretsmanager get-secret-value --secret-id roboshop/mysql/password --query SecretString --output text | jq -r .MYSQL_ROOT_PASSWORD > /tmp/mysql_root_password.txt
          volumeMounts:
            - mountPath: /tmp
              name: mysql-secret
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: roboshop
  labels:
    project: roboshop
    component: mysql
    tier: database
spec:
  selector:
    project: roboshop
    component: mysql
    tier: database
  ports:
    - protocol: TCP
      port: 3306 # service port
      targetPort: 3306 # container port
